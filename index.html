<!DOCTYPE html>
<html>
<head>
<title>Shape Summoner</title>
<style>
body { margin:0; overflow:hidden; background:#111; }
canvas { display:block; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<script>
const c = document.getElementById("game");
const x = c.getContext("2d");

function resize() {
  c.width = innerWidth;
  c.height = innerHeight;
}
resize();
onresize = resize;

// Player
const p = {
  x: c.width/2,
  y: c.height/2,
  r: 20,
  s: 5,
  col: "white",
  hp: 100,
  maxHp: 100,
  regen: 0.1,
  mana: 50,
  maxMana: 50,
  mRegen: 0.2,
  lvl: 1,
  xp: 0,
  xpNext: 20,
  dmg: 1,
  sCost: 5,
  shCost: 3,
  spdBoost: 0,
  multi: false,
  multiCount: 2,
  shootCooldown: 0,
  shootDelay: 10
};

// Game state
let boss = null;
let shots = [];
let bShots = [];
let sums = [];
let enemy = [];   // <—— REQUIRED for effects.js
let keys = {};
let shape = 1;
let lastX = p.x;
let lastY = p.y;
let dead = false;
let choose = false;
let cards = [];
let difficulty = 1;
let eventTimer = 0;

// Upgrades
const upgrades = [
  { name:"Max HP + Heal", apply(){ p.maxHp+=20; p.hp=p.maxHp; }},
  { name:"Max Mana + Restore", apply(){ p.maxMana+=20; p.mana=p.maxMana; }},
  { name:"Shot Damage Up", apply(){ p.dmg+=1; }},
  { name:"Regen Boost", apply(){ p.regen+=0.05; p.mRegen+=0.1; }},
  { name:"Move Speed Up", apply(){ p.s+=0.5; }},
  { name:"Summon HP Up", apply(){ sums.forEach(s=>s.hp+=10); }},
  { name:"Summon Radius Up", apply(){ sums.forEach(s=>s.r+=5); }},
  { name:"Mana Efficiency", apply(){ p.sCost=Math.max(1,p.sCost-1); p.shCost=Math.max(1,p.shCost-1); }},
  { name:"Projectile Speed Up", apply(){ p.spdBoost+=1; }},
  { name:"Multi-Shot +1", apply(){ p.multi=true; p.multiCount+=1; }},
  { name:"Faster Shooting", apply(){ p.shootDelay=Math.max(3,p.shootDelay-2); }}
];

const godUpgrades = [
  { name:"Divine Power +10 DMG", apply(){ p.dmg += 10; }},
  { name:"Godspeed +10 Move Speed", apply(){ p.s += 10; }},
  { name:"Infinite Mana Regen", apply(){ p.mRegen += 5; }},
  { name:"Immortal Summons", apply(){ sums.forEach(s=>s.hp += 9999); }},
  { name:"Mega Radius +50", apply(){ p.r += 50; }},
  { name:"Heaven’s Wrath (screen nuke)", apply(){ boss = null; bShots = []; shots = []; }}
];

const events = [
  { name:"Meteor Shower", run(){ spawnMeteors(); }},
  { name:"Healing Wave", run(){ p.hp = p.maxHp; }},
  { name:"Mana Storm", run(){ p.mana = p.maxMana; }},
  { name:"Summon Burst", run(){ spawnRandomSummons(); }},
  { name:"Boss Frenzy", run(){ difficulty += 0.5; }},
  { name:"Time Slow", run(){ p.s += 3; }}
];

// Save / Load
function saveGame() {
  const data = { p, difficulty, sums };
  localStorage.setItem("summonerSave", JSON.stringify(data));
}

function loadGame() {
  const raw = localStorage.getItem("summonerSave");
  if (!raw) return false;
  const data = JSON.parse(raw);
  Object.assign(p, data.p);
  difficulty = data.difficulty;
  sums = data.sums || [];
  return true;
}

function resetSave() {
  localStorage.removeItem("summonerSave");
}

// Mouse
onmousemove = e => {
  lastX = e.clientX;
  lastY = e.clientY;
};

// Border collision
function borderCollide(obj) {
  if (obj.x - obj.r < 0) { obj.x = obj.r; return true; }
  if (obj.x + obj.r > c.width) { obj.x = c.width - obj.r; return true; }
  if (obj.y - obj.r < 0) { obj.y = obj.r; return true; }
  if (obj.y + obj.r > c.height) { obj.y = c.height - obj.r; return true; }
  return false;
}

// Boss spawn
function spawnBoss() {
  const eliteChance = 0.2;
  const godChance = 0.05;
  const isGod = Math.random() < godChance;
  const elite = !isGod && Math.random() < eliteChance;

  boss = {
    x: Math.random()*c.width,
    y: Math.random()*c.height,
    r: isGod ? 120 : elite ? 70 : 50,
    hp: (isGod ? 300 : elite ? 40 : 15) * difficulty,
    s: (isGod ? 4 : elite ? 3 : 2) * (0.8 + difficulty * 0.2),
    col: isGod ? "gold" : elite ? "purple" : "red",
    elite,
    god: isGod,
    cd: 0
  };
}

// Random events
function triggerRandomEvent() {
  const e = events[Math.floor(Math.random() * events.length)];
  e.run();
}

function spawnMeteors() {
  for (let i = 0; i < 10; i++) {
    bShots.push({
      x: Math.random() * c.width,
      y: -50,
      r: 20,
      sp: 8,
      dx: 0,
      dy: 1,
      col: "orange",
      dmg: 5 * difficulty
    });
  }
}

function spawnRandomSummons() {
  for (let i = 0; i < 5; i++) {
    sums.push({
      x: Math.random() * c.width,
      y: Math.random() * c.height,
      r: 20,
      col: `hsl(${Math.random()*360},80%,60%)`,
      sh: Math.floor(Math.random()*4)+1,
      hp: 20
    });
  }
}

// =========================
// UPDATE LOOP (HOOK ADDED)
// =========================

function update() {
  if (p.shootCooldown > 0) p.shootCooldown--;

  if (!dead && !choose) {
    if (keys["w"] || keys["W"]) p.y -= p.s;
    if (keys["s"] || keys["S"]) p.y += p.s;
    if (keys["a"] || keys["A"]) p.x -= p.s;
    if (keys["d"] || keys["D"]) p.x += p.s;

    borderCollide(p);

    p.hp = Math.min(p.maxHp, p.hp + p.regen);
    p.mana = Math.min(p.maxMana, p.mana + p.mRegen);
  }

  eventTimer++;
  if (eventTimer > 1800) {
    triggerRandomEvent();
    eventTimer = 0;
  }

  // Boss logic (unchanged)
  if (boss && !dead && !choose) {
    let angle = Math.atan2(p.y - boss.y, p.x - boss.x);

    for (let i = 0; i < sums.length; i++) {
      const s = sums[i];
      const d = Math.hypot(boss.x - s.x, boss.y - s.y);
      if (d < boss.r + s.r) {
        s.hp -= 0.2;
        if (s.hp <= 0) {
          sums.splice(i, 1);
          i--;
        }
        angle += Math.PI / 2;
      }
    }

    boss.x += Math.cos(angle) * boss.s;
    boss.y += Math.sin(angle) * boss.s;
    borderCollide(boss);
  }

  // ⭐ EFFECTS UPDATE HOOK
  effectsUpdate();
}

// =========================
// DRAW LOOP (HOOK ADDED)
// =========================

function draw() {
  x.clearRect(0, 0, c.width, c.height);

  // Player
  x.fillStyle = p.col;
  x.beginPath();
  x.arc(p.x, p.y, p.r, 0, Math.PI*2);
  x.fill();

  // Summons
  for (const s of sums) {
    x.fillStyle = s.col;
    x.beginPath();
    x.arc(s.x, s.y, s.r, 0, Math.PI*2);
    x.fill();
  }

  // Boss
  if (boss) {
    x.fillStyle = boss.col;
    x.beginPath();
    x.arc(boss.x, boss.y, boss.r, 0, Math.PI*2);
    x.fill();
  }

  // ⭐ EFFECTS DRAW HOOK
  effectsDraw();
}

// =========================
// MAIN LOOP
// =========================

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();

</script>

<!-- ⭐ LOAD EFFECTS.JS -->
<script src="effects.js?v=1"></script>


</body>
</html>
